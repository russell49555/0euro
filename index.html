<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0 euro</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0 euro">
<style>
  :root { --top: max(env(safe-area-inset-top), 8px); }
  html { margin: 0; background-color: #4a90d9; }
  body { margin: 0; background-color: #4a90d9; height: calc(100dvh + 2px); padding-top: var(--top); box-sizing: border-box; }
  .cover { position: fixed; top: 0; left: 0; right: 0; height: var(--top); background-color: #4a90d9; z-index: 2; }
  iframe { display: block; border: 0; width: 100%; height: calc(100dvh - var(--top)); }
</style>
</head>
<body>
<div class="cover"></div>
<iframe src="https://script.google.com/macros/s/AKfycbwI7z-0g9vpvSmqrr7uPqdU06VcRTd77zc1HpAykWgFSZYiho-EfU4HWoCDeax8uGs/exec"></iframe>
<script>
window.addEventListener('load', function () {
  setTimeout(function () {
    window.scrollTo(0, 2);
    setTimeout(function () { window.scrollTo(0, 0); }, 60);
  }, 400);
});
</script>
</body>
</html>
