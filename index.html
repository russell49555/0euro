<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0 euro</title>
<link rel="apple-touch-icon" href="https://russell49555.github.io/0euro/icon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="https://russell49555.github.io/0euro/icon.png?v=2">
<link rel="icon" type="image/png" href="https://russell49555.github.io/0euro/icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="0 euro">
<meta name="theme-color" content="#4a90d9">
<style>
  * { box-sizing: border-box; }

  /* Цвет статус-бара iOS наследуется от фона html */
  html {
    background-color: #4a90d9;
    height: 100%;
  }

  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-height: 100%;
    background-color: #4a90d9;
    overflow: hidden;
  }

  iframe {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    height: 100%;
    border: 0;
    margin: 0;
    padding: 0;
    display: block;
    background-color: #f2f2f2;
  }

  #splash {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: #ffffff;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease;
  }
  #splash img {
    width: 110px;
    height: 110px;
    border-radius: 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.95); opacity: 0.85; }
  }
</style>
</head>
<body>

<iframe id="app" src="https://script.google.com/macros/s/AKfycbwI7z-0g9vpvSmqrr7uPqdU06VcRTd77zc1HpAykWgFSZYiho-EfU4HWoCDeax8uGs/exec"></iframe>

<div id="splash">
  <img src="https://russell49555.github.io/0euro/icon.png?v=2" alt="0 euro">
</div>

<script>
  document.getElementById('app').addEventListener('load', function () {
    var s = document.getElementById('splash');
    s.style.opacity = '0';
    setTimeout(function () {
      s.style.display = 'none';
    }, 300);
  });
</script>
</body>
</html>
