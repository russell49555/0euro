<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0 euro</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0 euro">
<meta name="theme-color" content="#4a90d9">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #4a90d9;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* Верхний синий фон под системным статус-баром */
  .cover {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: max(env(safe-area-inset-top), 44px);
    background-color: #4a90d9;
    z-index: 2;
    pointer-events: none;
  }

  /* Окно приложения: опущено ниже Dynamic Island/блюра, привязано к нижнему краю */
  iframe {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    top: max(env(safe-area-inset-top), 48px);
    height: calc(100% - max(env(safe-area-inset-top), 48px));
    border: 0;
    display: block;
  }
</style>
</head>
<body>
<div class="cover"></div>
<iframe src="https://script.google.com/macros/s/AKfycbwI7z-0g9vpvSmqrr7uPqdU06VcRTd77zc1HpAykWgFSZYiho-EfU4HWoCDeax8uGs/exec"></iframe>
</body>
</html>
