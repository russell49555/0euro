<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0 euro</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0 euro">
<style>
  html, body { margin: 0; padding: 0; background: #4a90d9; overflow: hidden; overscroll-behavior: none; }
  #probe { position: fixed; top: 0; left: 0; width: 0; height: env(safe-area-inset-top); visibility: hidden; }
  iframe { position: fixed; left: 0; width: 100%; border: 0; display: block; background: #f2f2f2; }
  #splash { position: fixed; inset: 0; background: #4a90d9; color: #fff; z-index: 5;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    font-family: -apple-system, Roboto, Arial, sans-serif; font-size: 17px;
    transition: opacity .35s; }
  #splash .sp { width: 28px; height: 28px; margin-bottom: 14px; border: 3px solid rgba(255,255,255,.35);
    border-top-color: #fff; border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="probe"></div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbwI7z-0g9vpvSmqrr7uPqdU06VcRTd77zc1HpAykWgFSZYiho-EfU4HWoCDeax8uGs/exec"></iframe>
<div id="splash"><div class="sp"></div>0 euro collection</div>
<script>
var EXTRA = 16;

function layout() {
  var safe = document.getElementById('probe').offsetHeight || 59;
  var top = safe + EXTRA;
  var portrait = window.innerHeight >= window.innerWidth;
  var H = portrait ? Math.max(screen.width, screen.height)
                   : Math.min(screen.width, screen.height);
  var f = document.getElementById('app');
  f.style.top = top + 'px';
  f.style.height = (H - top) + 'px';
}

layout();
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function () { setTimeout(layout, 200); });
window.addEventListener('pageshow', layout);

document.getElementById('app').addEventListener('load', function () {
  var s = document.getElementById('splash');
  s.style.opacity = '0';
  setTimeout(function () { s.style.display = 'none'; }, 400);
});
</script>
</body>
</html>
