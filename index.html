<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0 euro</title>
<link rel="apple-touch-icon" href="https://russell49555.github.io/0euro/icon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="https://russell49555.github.io/0euro/icon.png?v=2">
<link rel="icon" type="image/png" href="https://russell49555.github.io/0euro/icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0 euro">
<meta name="theme-color" content="#4a90d9">
<style>
  :root {
    --safe-top: calc(max(env(safe-area-inset-top), 20px) + 8px);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background-color: #f2f2f2;
  }
  html.lock, html.lock body {
    overflow: hidden;
  }

  .cover {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--safe-top);
    background-color: #4a90d9;
    z-index: 2;
    pointer-events: none;
  }

  iframe {
    display: block;
    width: 100%;
    margin-top: var(--safe-top);
    height: calc(100vh - var(--safe-top));
    border: 0;
    background-color: #f2f2f2;
  }

  #splash {
    position: fixed;
    inset: 0;
    background-color: #ffffff;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease;
  }
  #splash img {
    width: 110px;
    height: 110px;
    border-radius: 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.95); opacity: 0.85; }
  }
</style>
</head>
<body>
<div class="cover" id="cover"></div>
<iframe id="app" scrolling="no" src="https://script.google.com/macros/s/AKfycbwI7z-0g9vpvSmqrr7uPqdU06VcRTd77zc1HpAykWgFSZYiho-EfU4HWoCDeax8uGs/exec"></iframe>

<div id="splash">
  <img src="https://russell49555.github.io/0euro/icon.png?v=2" alt="0 euro">
</div>

<script>
  var frame = document.getElementById('app');
  var cover = document.getElementById('cover');
  var splash = document.getElementById('splash');
  var innerWin = null;
  var extra = 0;
  var ticking = false;

  function hideSplash() {
    if (splash.style.display === 'none') return;
    splash.style.opacity = '0';
    setTimeout(function () { splash.style.display = 'none'; }, 300);
  }
  frame.addEventListener('load', hideSplash);

  function sendView() {
    if (!innerWin) return;
    try {
      innerWin.postMessage({
        src: '0euro',
        type: 'view',
        y: Math.max(0, window.pageYOffset),
        vh: window.innerHeight,
        safeTop: cover.offsetHeight,
        extra: extra
      }, '*');
    } catch (e) {}
  }

  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () { ticking = false; sendView(); });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);

  window.addEventListener('message', function (e) {
    if (String(e.origin).indexOf('googleusercontent.com') < 0) return;
    var d = e.data;
    if (!d || d.src !== '0euro') return;
    innerWin = e.source;

    if (d.type === 'size') {
      extra = Math.max(0, frame.offsetHeight - d.ih);
      var minH = window.innerHeight - cover.offsetHeight;
      var newH = Math.max(Math.ceil(d.h + extra), minH);
      if (Math.abs(newH - frame.offsetHeight) > 1) frame.style.height = newH + 'px';
      hideSplash();
    } else if (d.type === 'lock') {
      document.documentElement.classList.toggle('lock', !!d.v);
    }
    sendView();
  });
</script>
</body>
</html>
