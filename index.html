<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0 euro</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0 euro">
<meta name="theme-color" content="#4a90d9">
<style>
  :root { --top: max(env(safe-area-inset-top), 8px); --shift: 50px; }
  html { margin: 0; height: 100%; background-color: #4a90d9; overscroll-behavior: none; }
  body { margin: 0; height: 100%; position: relative; background-color: #4a90d9; overscroll-behavior: none; }

  .cover { position: fixed; top: 0; left: 0; right: 0; height: var(--top);
    background-color: #4a90d9; z-index: 2; pointer-events: none; }

  .remove-blur { position: fixed; inset: 0 0 auto; height: 11px; z-index: 3; pointer-events: none;
    background: #4a90d9; -webkit-background-clip: text; background-clip: text; }

  #ghost-cover { display: none; position: fixed; inset: 0; z-index: 9998;
    background: rgba(255,255,255,0.01); pointer-events: none; animation: gfade 0.3s; }
  #ghost-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 90%; z-index: 9999;
    background: rgba(255,255,255,0.01); pointer-events: none;
    transform: translateX(110%); transition: transform 0.3s; }
  @keyframes gfade { from { opacity: 0; } to { opacity: 1; } }

  iframe { position: absolute; left: 0; width: 100%; border: 0;
    top: calc(var(--top) - var(--shift));
    height: calc(100% - var(--top) + var(--shift)); }
</style>
</head>
<body>
<div class="cover"></div>
<div class="remove-blur" aria-hidden="true"></div>
<div id="ghost-cover"></div>
<div id="ghost-panel"></div>

<iframe src="https://script.google.com/macros/s/AKfycbwI7z-0g9vpvSmqrr7uPqdU06VcRTd77zc1HpAykWgFSZYiho-EfU4HWoCDeax8uGs/exec"></iframe>

<script>
function ghost() {
  var c = document.getElementById('ghost-cover');
  var p = document.getElementById('ghost-panel');
  void p.offsetWidth;
  requestAnimationFrame(function () {
    c.style.display = 'block';
    p.style.transform = 'translateX(0%)';
    setTimeout(function () {
      c.style.display = 'none';
      p.style.transform = 'translateX(110%)';
    }, 500);
  });
}
window.addEventListener('load', function () { setTimeout(ghost, 300); });
window.addEventListener('pageshow', function () { setTimeout(ghost, 300); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) setTimeout(ghost, 300);
});
</script>
</body>
</html>
