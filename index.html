<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0 euro</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0 euro">
<style>
  html, body { margin: 0; padding: 0; background: #fff; overflow: hidden; overscroll-behavior: none; }
  html.ready, html.ready body { background: #f2f2f2; }

  .probe { position: fixed; left: 0; width: 0; visibility: hidden; }
  #pt { top: 0; height: env(safe-area-inset-top); }
  #pb { bottom: 0; height: env(safe-area-inset-bottom); }

  iframe { position: fixed; left: 0; width: 100%; border: 0; display: block; background: #f2f2f2; }

  #topfill { position: fixed; top: 0; left: 0; right: 0; background: #4a90d9; display: none; z-index: 2; pointer-events: none; }
  html.ready #topfill { display: block; }

  #dbg { position: fixed; left: 8px; z-index: 9; font: 9px/1.1 monospace; color: #fff; pointer-events: none; white-space: nowrap; }

  #splash { position: fixed; inset: 0; background: #fff; z-index: 5; display: flex; align-items: center;
    justify-content: center; transition: opacity .35s; }
  #splash img { width: 120px; height: 120px; border-radius: 27px; box-shadow: 0 6px 20px rgba(0,0,0,.18);
    animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.94); opacity: .8; } }
</style>
</head>
<body>
<div class="probe" id="pt"></div>
<div class="probe" id="pb"></div>
<div id="topfill"></div>
<div id="dbg"></div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbwI7z-0g9vpvSmqrr7uPqdU06VcRTd77zc1HpAykWgFSZYiho-EfU4HWoCDeax8uGs/exec"></iframe>
<div id="splash"><img src="icon.png" alt=""></div>
<script>
var EXTRA = 16;
var DEBUG = true;

function layout() {
  var safeT = document.getElementById('pt').offsetHeight || 59;
  var safeB = document.getElementById('pb').offsetHeight || 0;
  var top = safeT + EXTRA;
  var portrait = window.innerHeight >= window.innerWidth;
  var H = portrait ? Math.max(screen.width, screen.height)
                   : Math.min(screen.width, screen.height);
  var f = document.getElementById('app');
  f.style.top = top + 'px';
  f.style.height = (H - top) + 'px';

  var tf = document.getElementById('topfill');
  tf.style.height = top + 'px';

  var d = document.getElementById('dbg');
  if (DEBUG) {
    var vv = window.visualViewport ? Math.round(window.visualViewport.height) : '-';
    d.style.top = (safeT + 2) + 'px';
    d.textContent = 'inner ' + window.innerHeight + ' | screen ' + screen.height +
      ' | vv ' + vv + ' | safeT ' + safeT + ' | safeB ' + safeB + ' | H ' + H;
  } else {
    d.style.display = 'none';
  }
}

layout();
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', function () { setTimeout(layout, 200); });
window.addEventListener('pageshow', layout);

document.getElementById('app').addEventListener('load', function () {
  document.documentElement.classList.add('ready');
  layout();
  var s = document.getElementById('splash');
  s.style.opacity = '0';
  setTimeout(function () { s.style.display = 'none'; }, 400);
});
</script>
</body>
</html>
