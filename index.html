<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0 euro</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0 euro">
<meta name="theme-color" content="#4a90d9">
<style>
  :root {
    --bar: max(env(safe-area-inset-top), 48px);
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    background-color: #f2f2f2;
    overflow: hidden;
    overscroll-behavior: none;
  }

  /* Синяя плашка строго под статус-баром */
  .cover {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: var(--bar);
    background-color: #4a90d9;
    z-index: 2;
    pointer-events: none;
  }

  /* Фрейм с запасом вниз на 40px, чтобы перекрыть домашний бар без зазоров */
  iframe {
    position: fixed;
    top: var(--bar);
    left: 0;
    width: 100%;
    height: calc(100dvh - var(--bar) + 40px);
    height: calc(100% - var(--bar) + 40px);
    border: 0;
    display: block;
    background: #f2f2f2;
  }
</style>
</head>
<body>
<div class="cover"></div>
<iframe src="https://script.google.com/macros/s/AKfycbwI7z-0g9vpvSmqrr7uPqdU06VcRTd77zc1HpAykWgFSZYiho-EfU4HWoCDeax8uGs/exec"></iframe>
</body>
</html>
