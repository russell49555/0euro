<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>0 euro</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="0 euro">
<style>
  :root { --top: max(env(safe-area-inset-top), 8px); --shift: 50px; }
  html { margin: 0; height: 100%; background-color: #4a90d9; overscroll-behavior: none; }
  body { margin: 0; height: 100%; position: relative; background-color: #4a90d9; overscroll-behavior: none; }
  .cover { position: fixed; top: 0; left: 0; right: 0; height: var(--top); background-color: #4a90d9; z-index: 2; }
  iframe {
    position: absolute; left: 0; width: 100%; border: 0;
    top: calc(var(--top) - var(--shift));
    height: calc(100% - var(--top) + var(--shift));
  }
</style>
</head>
<body>
<div class="cover" id="cover"></div>
<iframe src="https://script.google.com/macros/s/AKfycbwI7z-0g9vpvSmqrr7uPqdU06VcRTd77zc1HpAykWgFSZYiho-EfU4HWoCDeax8uGs/exec"></iframe>
<script>
function resetTint() {
  var old = document.getElementById('cover');
  if (old) old.remove();
  setTimeout(function () {
    var c = document.createElement('div');
    c.className = 'cover';
    c.id = 'cover';
    document.body.insertBefore(c, document.body.firstChild);
  }, 120);
}
window.addEventListener('load', function () {
  setTimeout(resetTint, 300);
  setTimeout(resetTint, 1500);
  setTimeout(resetTint, 4000);
});
window.addEventListener('pageshow', function () { setTimeout(resetTint, 300); });
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) setTimeout(resetTint, 300);
});
</script>
</body>
</html>
